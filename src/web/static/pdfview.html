<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PDF</title>
<style>
:root { --ink: #1c1c1c; --line: #d9d9d4; --bg: #e9e9e4; --hl: rgba(255, 196, 0, 0.42); --hl-line: rgba(214, 150, 0, 0.9); }
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body { font-family: system-ui, -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; color: var(--ink); background: var(--bg); display: flex; flex-direction: column; }
.bar { display: flex; align-items: center; gap: 0.35rem; padding: 0.3rem 0.6rem; background: #fbfbf8; border-bottom: 1px solid var(--line); font-size: 0.8rem; flex: none; }
.bar button { font: inherit; width: 1.8rem; height: 1.6rem; display: inline-flex; align-items: center; justify-content: center; padding: 0; border: 1px solid transparent; border-radius: 4px; background: transparent; color: #444; cursor: pointer; }
.bar button:hover { background: #f1f1ec; border-color: var(--line); }
.bar button svg { width: 1.05rem; height: 1.05rem; }
.bar .zoom { min-width: 3.2rem; text-align: center; color: #555; }
.bar .sep { width: 1px; height: 1.1rem; background: var(--line); margin: 0 0.25rem; }
.bar input { font: inherit; width: 3rem; padding: 0.1rem 0.3rem; border: 1px solid var(--line); border-radius: 4px; text-align: right; }
.bar .of { color: #666; }
#scroller { flex: 1; overflow: auto; position: relative; }
#pages { padding: 12px 0 24px; }
.page { position: relative; margin: 0 auto 12px; background: #fff; box-shadow: 0 1px 4px rgba(0, 0, 0, 0.18); }
.page canvas { position: absolute; inset: 0; width: 100%; height: 100%; }
/* Text layer: the transparent text over the page, as pdf.js lays it out. */
.textLayer { position: absolute; inset: 0; overflow: clip; opacity: 1; line-height: 1; text-align: initial; -webkit-text-size-adjust: none; text-size-adjust: none; forced-color-adjust: none; transform-origin: 0 0; caret-color: CanvasText; z-index: 0; }
.textLayer :is(span, br) { color: transparent; position: absolute; white-space: pre; cursor: text; transform-origin: 0% 0%; }
.page { --user-unit: 1; --total-scale-factor: calc(var(--scale-factor) * var(--user-unit)); --scale-round-x: 1px; --scale-round-y: 1px; }
.textLayer { --min-font-size: 1; --text-scale-factor: calc(var(--total-scale-factor) * var(--min-font-size)); --min-font-size-inv: calc(1 / var(--min-font-size)); }
.textLayer > :not(.markedContent), .textLayer .markedContent span:not(.markedContent) { z-index: 1; --font-height: 0; font-size: calc(var(--text-scale-factor) * var(--font-height)); --scale-x: 1; --rotate: 0deg; transform: rotate(var(--rotate)) scaleX(var(--scale-x)) scale(var(--min-font-size-inv)); }
.textLayer span.markedContent { top: 0; height: 0; }
.textLayer ::selection { background: rgba(0, 90, 200, 0.25); }
.textLayer br::selection { background: transparent; }
/* The cited passage: a piece of a text span, laid out inline in it. */
.textLayer span.hl, .textLayer .markedContent span.hl { position: static; font-size: inherit; transform: none; background: var(--hl); border-radius: 2px; box-shadow: 0 0 0 1px var(--hl-line) inset; }
.msg { margin: 20vh auto; max-width: 28rem; text-align: center; color: #555; font-size: 0.9rem; }
</style>
</head>
<body>
<div class="bar">
  <button type="button" id="zoom-out" title="Zoom out" aria-label="Zoom out"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M5 12h14"/></svg></button>
  <span class="zoom" id="zoom">100%</span>
  <button type="button" id="zoom-in" title="Zoom in" aria-label="Zoom in"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg></button>
  <button type="button" id="zoom-fit" title="Fit the width" aria-label="Fit the width"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12h16M7 9l-3 3 3 3M17 9l3 3-3 3"/></svg></button>
  <span class="sep"></span>
  <input id="page" type="text" inputmode="numeric" aria-label="Page" value="1"><span class="of" id="of">/ ?</span>
</div>
<div id="scroller"><div id="pages"><div class="msg" id="msg">Loading the PDF ...</div></div></div>
<script type="module" src="pdfview.js"></script>
</body>
</html>
